<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Collections</title>
    <style>
        body {
            font-family: "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
            margin: 0;
            user-select: none;
        }

        .view {
            display: none;
        }

        .list {
            list-style: none;
            padding: 10px;
            margin: 0;
        }

        .listItem {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .listItem:hover {
            background-color: #f0f0f0;
        }

        .listItem span {
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
        }
        
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px;
            background-color: white;
            border-bottom: 1px solid #eee;
        }
        
        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-spacer {
            flex-grow: 1;
        }
        
        .toolbar h3 {
             margin: 0;
             margin-top: 10px;
        }

        .search-container {
            position: relative;
            margin-top: 10px;
        }

        #itemSearchInput {
            padding: 5px 25px 5px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        #clearSearchButton {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            color: #888;
            font-size: 16px;
            padding: 0 5px;
        }
        
        #customContextMenu {
            position: absolute;
            z-index: 1000;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 5px 0;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
        }

        .context-menu-item:hover {
            background-color: #f0f0f0;
        }

        /* Add/Edit Item View Styles */
        .add-item-form {
            padding: 15px;
        }

        .add-item-form h3 {
            margin-top: 0;
        }

        .add-item-form label {
            display: block;
            margin-bottom: 5px;
        }

        .add-item-form input[type="text"] {
            width: calc(100% - 12px);
            padding: 5px;
            margin-bottom: 10px;
        }
        
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .tag-button {
            padding: 5px 10px;
            background-color: #eee;
            border: 1px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .tag-button.selected {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }
        
        /* Manage Tags View Styles */
        .add-tag-form {
            padding: 10px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #eee;
        }
        .add-tag-form input {
            flex-grow: 1;
            padding: 5px;
        }
        
        .manage-tag-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .tag-actions button {
            margin-left: 5px;
        }

        /* Drag and Drop Styles */
        .drag-handle {
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: grab;
            background-image: url('data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-grip-vertical" viewBox="0 0 16 16"><path d="M7 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zM7 8a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm-3 3a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm3 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>');
            opacity: 0.5;
        }

        .manage-tag-item.dragging {
            opacity: 0.4;
            background: #e7f3ff;
        }

        .manage-tag-item.drag-over {
            border-top: 2px solid #007bff;
        }

    </style>
</head>
<body>

<div id="tagsView" class="view">
    <div class="toolbar">
        <h3>Tags</h3>
        <button id="manageTagsButton">Manage Tags</button>
        <button id="addItemButton">Add Item</button>
        <button id="exportButton">Export</button>
        <button id="importButton">Import</button>
        <input id="fileInput" type="file" style="display: none"/>
    </div>
    <ul id="tagList" class="list"></ul>
</div>

<div id="itemsView" class="view">
    <div class="toolbar">
        <div class="toolbar-row">
            <button id="backButton">Back</button>
            <span class="toolbar-spacer"></span>
            <button id="randomButton">Random</button>
            <button id="openAllButton">Open All</button>
        </div>
        <div class="search-container">
            <input type="search" id="itemSearchInput" placeholder="Search items...">
            <button id="clearSearchButton">&times;</button>
        </div>
        <h3 id="itemTitle"></h3>
    </div>
    <ul id="itemList" class="list"></ul>
</div>

<div id="addItemView" class="view">
     <div class="toolbar">
        <h3>Add / Edit Item</h3>
    </div>
    <div class="add-item-form">
        <label for="itemTitleInput">Title:</label>
        <input type="text" id="itemTitleInput">

        <label for="itemUrlInput">URL:</label>
        <input type="text" id="itemUrlInput">

        <h4>Choose Tags:</h4>
        <div id="existingTagsContainer" class="tag-container">
            <!-- Tag buttons will be generated here -->
        </div>
        
        <div style="margin-top: 15px;">
            <button id="saveItemButton">Save</button>
            <button id="cancelButton">Cancel</button>
        </div>
    </div>
</div>

<div id="manageTagsView" class="view">
    <div class="toolbar">
        <h3>Manage Tags</h3>
        <button id="closeManageTagsButton">Close</button>
    </div>
    <div class="add-tag-form">
        <input type="text" id="newTagInput" placeholder="New Tag Name">
        <button id="addNewTagButton">Add Tag</button>
    </div>
    <ul id="manageTagList" class="list"></ul>
</div>

<script src="sidebar.js"></script>
</body>
</html>
