<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Collections</title>
    <style>
        :root {
            --toolbar-height: auto;
            --list-padding: 10px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            user-select: none;
        }

        .view {
            display: none;
        }

        .list {
            list-style: none;
            padding: var(--list-padding);
            margin: 0;
            overflow-y: auto;
            max-height: calc(100vh - var(--toolbar-height) - 2 * var(--list-padding));
        }

        .listItem {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .listItem > div {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }

        .listItem .item-title {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4em;
            max-height: 4.2em;
            font-weight: 500;
        }

        .listItem .item-actor {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
        
        .listItem .item-image {
            border-radius: 4px;
            background-color: #f0f0f0;
            flex-shrink: 0;
            max-width: 50%;
            max-height: 120px;
            width: auto;
            height: auto;
        }

        .listItem:hover {
            background-color: #f0f0f0;
        }
        .listItem.highlighted {
            background-color: #e0f0ff;
            transition: background-color 0.3s ease-in-out;
        }

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 10px;
            background-color: white;
            border-bottom: 1px solid #eee;
        }

        .toolbar h3 {
            margin: 10px 0 0;
            padding: 0;
        }
        
        .toolbar .button-group-top {
             display: flex;
             flex-wrap: wrap;
             gap: 8px;
        }

        .button-group {
            margin-bottom: 10px;
        }
        
        .button-group .button-row {
            display: flex;
            gap: 8px;
        }
        
        .button-group .spacer {
            flex-grow: 1;
        }
        
        button {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover {
            background-color: #eee;
        }
        
        .button-danger {
            background-color: #e53e3e;
            color: white;
            border-color: #c53030;
        }
        .button-danger:hover {
            background-color: #c53030;
        }

        .search-container {
            position: relative;
            margin-top: 10px;
        }

        #itemSearchInput {
            width: 100%;
            padding: 6px 24px 6px 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #clearSearchButton {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            color: #888;
        }
        #clearSearchButton:hover {
            color: #333;
        }
        
        #tagFilterContainer {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        #actorFilterContainer {
            margin-top: 10px;
            display: none; /* Hidden by default, shown in All Items */
        }
        
        /* Styled input for actor filter */
        #actorFilterInput {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #customContextMenu {
            position: fixed;
            z-index: 1000;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            border-radius: 4px;
            padding: 5px 0;
        }

        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
        }

        .context-menu-item:hover {
            background-color: #f0f0f0;
        }

        /* Add/Edit View Styles */
        .form-container {
            padding: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .tag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        .tag-button {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f8f8f8;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tag-button.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .actor-chip {
            padding: 4px 8px;
            background-color: #e0e0e0;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #ccc;
        }
        .actor-chip .remove-actor {
            cursor: pointer;
            font-weight: bold;
            color: #666;
            padding: 0 2px;
        }
        .actor-chip .remove-actor:hover {
            color: red;
        }

        .view-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Manage Tags View Styles */
        .manage-tag-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .manage-tag-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .manage-tag-item.dragging {
            opacity: 0.5;
        }
        .manage-tag-item.drag-over {
            background-color: #e0f0ff;
        }
        .drag-handle {
            cursor: move;
            margin-right: 10px;
            color: #888;
        }
        .drag-handle::before {
            content: '☰';
        }
        .tag-name {
            flex-grow: 1;
        }
        .tag-actions button {
            margin-left: 5px;
        }
    </style>
</head>
<body>

<!-- Tags View (Main View) -->
<div id="tagsView" class="view">
    <div class="toolbar">
        <div class="button-group-top">
            <button id="manageTagsButton">Manage Tags</button>
            <button id="addItemButton">Add Item</button>
            <span class="spacer"></span>
            <button id="exportButton">Export</button>
            <button id="importButton">Import</button>
            <input id="fileInput" type="file" style="display: none"/>
        </div>
    </div>
    <ul id="tagList" class="list"></ul>
</div>

<!-- Items View -->
<div id="itemsView" class="view">
    <div class="toolbar">
        <div class="button-group">
            <div class="button-row">
                <button id="backButton">Back</button>
                <span class="spacer"></span>
                <button id="randomButton">Random</button>
                <button id="openAllButton">Open All</button>
            </div>
        </div>
        <div class="search-container">
            <input type="search" id="itemSearchInput" placeholder="Search items or actors...">
            <button id="clearSearchButton" title="Clear search">&times;</button>
        </div>
        <div id="tagFilterContainer"></div>
        
        <!-- Modified Actor Filter Container -->
        <div id="actorFilterContainer">
            <input type="text" id="actorFilterInput" list="actorFilterDatalist" placeholder="Filter by Actor (Type to search)">
            <datalist id="actorFilterDatalist"></datalist>
        </div>
        
        <h3 id="itemTitle"></h3>
    </div>
    <ul id="itemList" class="list"></ul>
</div>

<!-- Add/Edit Item View -->
<div id="addItemView" class="view">
    <div class="toolbar">
        <h3>Add / Edit Item</h3>
    </div>
    <div class="form-container">
        <div class="form-group">
            <label for="itemTitleInput">Title</label>
            <input type="text" id="itemTitleInput">
        </div>
        <div class="form-group">
            <label for="itemUrlInput">URL</label>
            <input type="url" id="itemUrlInput">
        </div>
        <div class="form-group">
            <label for="itemImageUrlInput">Image URL</label>
            <input type="url" id="itemImageUrlInput" placeholder="Leave empty to auto-detect">
        </div>
        
        <div class="form-group">
            <label for="itemActorInput">Actors</label>
            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                <input type="text" id="itemActorInput" list="actorSuggestions" placeholder="Type name and press Enter or Add" style="flex-grow: 1;">
                <datalist id="actorSuggestions"></datalist>
                <button id="addActorButton" type="button">Add</button>
            </div>
            <div id="selectedActorsContainer" class="tag-selector" style="min-height: 40px;"></div>
        </div>

        <div class="form-group">
            <label>Choose Tags</label>
            <div id="existingTagsContainer" class="tag-selector"></div>
        </div>
    </div>
    <div class="view-footer">
        <button id="deleteItemButton" class="button-danger">Delete</button>
        <div class="spacer"></div>
        <button id="saveItemButton">Save</button>
        <button id="cancelButton">Cancel</button>
    </div>
</div>

<!-- Manage Tags View -->
<div id="manageTagsView" class="view">
    <div class="toolbar">
        <div class="view-header">
            <h3>Manage Tags</h3>
            <button id="closeManageTagsButton">Close</button>
        </div>
    </div>
    <div class="form-container">
        <div class="form-group">
            <label for="newTagInput">Add New Tag</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="newTagInput" placeholder="Enter new tag name" style="flex-grow: 1;">
                <button id="addNewTagButton">Add</button>
            </div>
        </div>
        <hr>
        <ul id="manageTagList" class="manage-tag-list"></ul>
    </div>
</div>

<script type="module" src="sidebar.js"></script>
</body>
</html>
