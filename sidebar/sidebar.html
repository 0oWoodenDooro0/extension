<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Collections</title>
    <style>
        :root {
            --list-padding: 10px;
        }

        /* 1. 鎖定最外層，禁止 Body 捲動 */
        html, body {
            height: 100vh; /* 強制視窗高度 */
            margin: 0;
            padding: 0;
            overflow: hidden; /* 隱藏 Body 的捲軸 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        /* 2. 視圖容器：佔滿 100% 高度，使用上下排列的 Flex */
        .view {
            display: none; /* JS 會切換 display */
            flex-direction: column;
            height: 100%; /* 繼承 Body 的高度 */
            width: 100%;
            overflow: hidden; /* 確保 View 本身不捲動 */
        }

        /* 3. 工具列：固定高度，不可壓縮 */
        .toolbar {
            flex-shrink: 0;
            background-color: white;
            border-bottom: 1px solid #eee;
            padding: 10px;
            z-index: 10;
        }

        /* 4. 清單區域：自動填滿剩餘空間，並產生自己的捲軸 */
        .list, .form-container {
            flex-grow: 1;
            overflow-y: auto; /* 捲軸出現在這裡 */
            min-height: 0;    /* [關鍵] 允許 Flex 子元素縮小，這能修復捲軸綁定問題 */
            padding: var(--list-padding);
            margin: 0;
        }

        /* 美化捲軸 (Chrome/Safari/New Edge) */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc; 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999; 
        }

        /* Firefox 捲軸樣式 */
        * {
            scrollbar-width: thin;
            scrollbar-color: #ccc #f1f1f1;
        }

        /* --- 以下為元件樣式 (保持不變) --- */
        .listItem {
            padding: 8px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .listItem > div {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-width: 0;
        }
        .listItem .item-title {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4em;
            max-height: 4.2em;
            font-weight: 500;
        }
        .listItem .item-actor {
            font-size: 0.85em;
            color: #666;
            margin-top: 4px;
        }
        .listItem .item-image {
            border-radius: 4px;
            background-color: #f0f0f0;
            flex-shrink: 0;
            max-width: 50%;
            max-height: 120px;
            width: auto;
            height: auto;
        }
        .listItem:hover {
            background-color: #f0f0f0;
        }
        .listItem.highlighted {
            background-color: #e0f0ff;
            transition: background-color 0.3s ease-in-out;
        }

        /* Toolbar Buttons */
        .button-group-top {
             display: flex;
             flex-wrap: wrap;
             gap: 8px;
             margin-bottom: 8px;
        }
        .spacer { flex-grow: 1; }
        
        button {
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f8f8;
            cursor: pointer;
            white-space: nowrap;
        }
        button:hover { background-color: #eee; }
        .button-danger {
            background-color: #e53e3e;
            color: white;
            border-color: #c53030;
        }
        .button-danger:hover { background-color: #c53030; }

        /* Inputs */
        .search-container {
            position: relative;
            margin-bottom: 8px;
        }
        #itemSearchInput {
            width: 100%;
            padding: 6px 24px 6px 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #clearSearchButton {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            color: #888;
        }
        
        #tagFilterContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            max-height: 60px;
            overflow-y: auto;
        }
        
        #actorFilterInput, .form-group input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Context Menu */
        #customContextMenu {
            position: fixed;
            z-index: 1000;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.15);
            border-radius: 4px;
            padding: 5px 0;
        }
        .context-menu-item {
            padding: 8px 15px;
            cursor: pointer;
        }
        .context-menu-item:hover { background-color: #f0f0f0; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .tag-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
        }
        .tag-button {
            padding: 3px 8px;
            border: 1px solid #ddd;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f8f8f8;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tag-button.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
        
        .actor-chip {
            padding: 4px 8px;
            background-color: #e0e0e0;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #ccc;
        }
        .image-input-group {
            display: flex;
            gap: 6px;
        }
        .image-preview-container {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .preview-thumb {
            max-width: 90px;
            max-height: 65px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #eee;
            border: 1px solid #ddd;
        }
        .preview-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-status {
            font-weight: 500;
        }
        .view-footer {
            padding: 10px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            background-color: white; /* 確保 footer 不透明 */
        }
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .manage-tag-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .manage-tag-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        .drag-handle {
            cursor: move;
            margin-right: 10px;
            color: #888;
        }
        .drag-handle::before { content: '☰'; }
        .tag-name { flex-grow: 1; }
        .tag-actions button { margin-left: 5px; }
    </style>
</head>
<body>

<!-- Items View (Default) -->
<div id="itemsView" class="view">
    <div class="toolbar">
        <div class="button-group-top">
            <button id="addItemButton" title="Add current tab">Add</button>
            <button id="randomButton">Random</button>
            <span class="spacer"></span>
            <button id="manageTagsButton">Tags</button>
            <button id="exportButton">Exp</button>
            <button id="importButton">Imp</button>
            <input id="fileInput" type="file" style="display: none"/>
        </div>
        
        <div class="search-container">
            <input type="search" id="itemSearchInput" placeholder="Search...">
            <button id="clearSearchButton" title="Clear search">&times;</button>
        </div>
        
        <div id="tagFilterContainer"></div>
        
        <div id="actorFilterContainer">
            <input type="text" id="actorFilterInput" list="actorFilterDatalist" placeholder="Filter Actor...">
            <datalist id="actorFilterDatalist"></datalist>
        </div>
    </div>
    <!-- List Container: This is what scrolls -->
    <ul id="itemList" class="list"></ul>
</div>

<!-- Add/Edit Item View -->
<div id="addItemView" class="view">
    <div class="toolbar">
        <h3>Add / Edit Item</h3>
    </div>
    <div class="form-container">
        <div class="form-group">
            <label for="itemTitleInput">Title</label>
            <input type="text" id="itemTitleInput">
        </div>
        <div class="form-group">
            <label for="itemUrlInput">URL</label>
            <input type="url" id="itemUrlInput">
        </div>
        <div class="form-group">
            <label for="itemImageUrlInput">Image URL</label>
            <div class="image-input-group">
                <input type="url" id="itemImageUrlInput" placeholder="Leave empty to auto-detect" style="flex-grow: 1;">
                <button id="fetchImageButton" type="button" title="Fetch preview image from URL">Fetch</button>
            </div>
            <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                <img id="imagePreview" class="preview-thumb" alt="Preview">
                <div class="preview-info">
                    <span id="imagePreviewStatus" class="preview-status">Preview</span>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="itemActorInput">Actors</label>
            <div style="display: flex; gap: 5px; margin-bottom: 5px;">
                <input type="text" id="itemActorInput" list="actorSuggestions" placeholder="Name..." style="flex-grow: 1;">
                <datalist id="actorSuggestions"></datalist>
                <button id="addActorButton" type="button">Add</button>
            </div>
            <div id="selectedActorsContainer" class="tag-selector" style="min-height: 40px;"></div>
        </div>

        <div class="form-group">
            <label>Choose Tags</label>
            <div id="existingTagsContainer" class="tag-selector"></div>
        </div>
    </div>
    <div class="view-footer">
        <button id="deleteItemButton" class="button-danger">Delete</button>
        <div class="spacer"></div>
        <button id="saveItemButton">Save</button>
        <button id="cancelButton">Cancel</button>
    </div>
</div>

<!-- Manage Tags View -->
<div id="manageTagsView" class="view">
    <div class="toolbar">
        <div class="view-header">
            <h3>Manage Tags</h3>
            <button id="closeManageTagsButton">Close</button>
        </div>
    </div>
    <div class="form-container">
        <div class="form-group">
            <label for="newTagInput">Add New Tag</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="newTagInput" placeholder="Enter new tag name" style="flex-grow: 1;">
                <button id="addNewTagButton">Add</button>
            </div>
        </div>
        <hr>
        <ul id="manageTagList" class="manage-tag-list"></ul>
    </div>
</div>

<script type="module" src="sidebar.js"></script>
</body>
</html>
